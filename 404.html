<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokaVélo</title>
  <link rel="stylesheet" href="/style.css?v=6">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="robots" content="noindex">
  <style>
    /* Mise en page centrée verticalement pour cette page dʼattente */
    .app-redirect {
      min-height: 100vh;
      padding: 112px 1.4rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    .app-redirect-content {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-redirect-icon {
      width: clamp(100px, 18vw, 150px);
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 16px 30px rgba(23, 103, 216, 0.18));
    }
    .app-redirect h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: var(--deep-blue);
      margin-bottom: 1rem;
    }
    .app-redirect p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .app-redirect .cta-zone {
      gap: 0.85rem;
    }
    .app-redirect .secondary-link {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: var(--blue);
      text-decoration: none;
    }
    .app-redirect .secondary-link:hover {
      color: var(--cyan);
      text-decoration: underline;
    }
    .app-redirect [hidden] {
      display: none;
    }
  </style>
  <!-- Mesure d'audience GoatCounter : sans cookies, pas de bandeau requis. -->
  <script data-goatcounter="https://lokavelo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <a href="/" class="logo">
    <img src="/ic_lokavelo_logo.png" alt="LokaVélo">
  </a>
  <nav>
    <a href="/" class="nav-pill">Accueil</a>
  </nav>
</header>

<section class="app-redirect">
  <div class="app-redirect-content">
    <img src="/ic_lokavelo_logo.png" alt="LokaVélo" class="app-redirect-icon">
    <h1 id="hero-title">Cette page est dans lʼapp</h1>
    <p id="hero-sub">
      Télécharge l’app LokaVélo pour accéder à cette page.
    </p>

    <div class="cta-zone">
      <!-- Mobile : un seul bouton, le OneLink ouvre le bon store. -->
      <div class="cta-buttons cta-mobile">
        <a href="https://onelinkto.app/r/lokavelo" class="btn-download" data-goatcounter-click="clic-onelink">
          <span class="btn-download-icons" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.64.64 0 00-.83.22l-1.88 3.24A10.45 10.45 0 0012 8c-1.57 0-3.06.37-4.48 1.06L5.64 5.67a.64.64 0 00-.83-.22.61.61 0 00-.26.85l1.84 3.18C3.93 10.95 2.68 13.07 2.5 15.5h19c-.18-2.43-1.43-4.55-3.9-6.02zM9 13H7v-2h2v2zm8 0h-2v-2h2v2z"/></svg></span>
          Télécharge l’app
          <span class="btn-download-icons" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg></span>
        </a>
      </div>
      <!-- Ordinateur (souris) : le OneLink renverrait vers le site, donc on
           propose directement les deux fiches. Bascule gérée dans style.css. -->
      <div class="cta-buttons cta-desktop">
        <a href="https://play.google.com/store/apps/details?id=com.arnoagape.lokavelo" class="btn-download" data-goatcounter-click="clic-google-play">
          <span class="btn-download-icons" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.64.64 0 00-.83.22l-1.88 3.24A10.45 10.45 0 0012 8c-1.57 0-3.06.37-4.48 1.06L5.64 5.67a.64.64 0 00-.83-.22.61.61 0 00-.26.85l1.84 3.18C3.93 10.95 2.68 13.07 2.5 15.5h19c-.18-2.43-1.43-4.55-3.9-6.02zM9 13H7v-2h2v2zm8 0h-2v-2h2v2z"/></svg></span>

          Voir sur l’App Store
        </a>
      </div>
      <a href="/" class="secondary-link">Retour à lʼaccueil</a>
    </div>
  </div>
</section>

  <p class="footer-line">

<script>
  (function () {
    /* ------------------------------------------------------------------
       Page de repli des liens profonds.

       GitHub Pages ne sait pas router `/bike/{id}` ou `/rental/owner/{id}` :
       ces chemins n'existent pas en tant que fichiers, donc le serveur sert
       cette page. Quand l'app est installée, le visiteur n'arrive jamais ici
       (App Links / Universal Links l'ouvrent directement) — cette page ne
       s'affiche donc que pour qui n'a pas encore l'app. D'où le seul contenu
       qui a du sens : de quoi la télécharger (boutons dans le HTML).
       ------------------------------------------------------------------ */

    var path = window.location.pathname || '';
    var titleEl = document.getElementById('hero-title');
    var subEl = document.getElementById('hero-sub');

    // Ce que le visiteur cherchait, décrit sans nommer de plateforme.
    if (path.indexOf('/bike/') === 0) {
      titleEl.textContent = 'Ce vélo est dans lʼapp';
      subEl.textContent = 'Installe LokaVélo pour voir les photos, le prix, les disponibilités — et réserver ce vélo en quelques minutes.';
      document.title = 'Voir ce vélo — LokaVélo';
    } else if (path.indexOf('/rental/owner/') === 0) {
      titleEl.textContent = 'Ta location est dans lʼapp';
      subEl.textContent = 'Ouvre LokaVélo pour gérer cette location en tant que propriétaire — acceptation, contre-offre, validation, paiement reçu.';
    } else if (path.indexOf('/rental/') === 0) {
      titleEl.textContent = 'Ta location est dans lʼapp';
      subEl.textContent = 'Ouvre LokaVélo pour voir le détail de ta location, payer ou faire ton état des lieux.';
    } else if (path.indexOf('/conversation/') === 0) {
      titleEl.textContent = 'La conversation est dans lʼapp';
      subEl.textContent = 'Ouvre LokaVélo pour échanger avec lʼautre partie et garder tous tes messages en sécurité.';
    } else {
      // Vraie 404 — on garde un message neutre.
      titleEl.textContent = 'Page introuvable';
      subEl.textContent = 'Cette page nʼexiste pas ou a été déplacée.';
      document.title = 'Page introuvable — LokaVélo';
    }

  })();
</script>

</body>
</html>
