<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compte de paiement configuré — LokaVélo</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="robots" content="noindex">
  <style>
    .app-redirect {
      min-height: 100vh;
      padding: 112px 1.4rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .app-redirect-content {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-redirect-icon {
      width: clamp(100px, 18vw, 150px);
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 16px 30px rgba(23, 103, 216, 0.18));
    }
    .app-redirect h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: var(--deep-blue);
      margin-bottom: 1rem;
    }
    .app-redirect p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .app-redirect .secondary-link {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: var(--blue);
      text-decoration: none;
    }
    .app-redirect .secondary-link:hover {
      color: var(--cyan);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <img src="/ic_lokavelo_logo.png" alt="LokaVélo">
  </a>
  <nav>
    <a href="/" class="nav-pill">Accueil</a>
  </nav>
</header>

<section class="app-redirect">
  <div class="app-redirect-content">
    <img src="/ic_lokavelo_logo.png" alt="LokaVélo" class="app-redirect-icon">
    <h1>Compte de paiement configuré ✓</h1>
    <p>
      Ta configuration de paiement Stripe est terminée. Retourne dans l’application
      LokaVélo pour recevoir les règlements de tes locations.
    </p>

    <div class="cta-zone">
      <a href="https://play.google.com/store/apps/details?id=com.arnoagape.lokavelo" class="btn-android">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.64.64 0 00-.83.22l-1.88 3.24A10.45 10.45 0 0012 8c-1.57 0-3.06.37-4.48 1.06L5.64 5.67a.64.64 0 00-.83-.22.61.61 0 00-.26.85l1.84 3.18C3.93 10.95 2.68 13.07 2.5 15.5h19c-.18-2.43-1.43-4.55-3.9-6.02zM9 13H7v-2h2v2zm8 0h-2v-2h2v2z"/></svg>
        Ouvrir LokaVélo
      </a>
      <a href="/" class="secondary-link">Retour à l’accueil</a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <p class="footer-line">
    © 2026 LokaVélo
    <span>—</span>
    <a href="/legal/cgu">CGU</a>
    <span>·</span>
    <a href="/legal/confidentialite">Confidentialité</a>
    <span>·</span>
    <a href="/legal/mentions-legales">Mentions légales</a>
    <span>·</span>
    <a href="/contact">Contact</a>
  </p>
</footer>

</body>
</html>
